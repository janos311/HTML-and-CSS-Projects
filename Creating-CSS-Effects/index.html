<!DOCTYPE html>
<html>

<head>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap');
</style>
    <title>Creating Effects with CSS</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css" </head>

<body>
    <!--NAVBAR-->
    <nav class="nav-bar">
        <ul>
            <li>
                <a href=#">Home</a>
            </li>
            <li class="drop">
                <a href="#">Images</a>
                <div class="rollover-menu">
                    <a href="#image1">Images 1</a>
                    <a href="#image2">Images 2</a>
                    <a href="#image3">Images 3</a>
                </div>
            </li>
        </ul>
    </nav>
    <!--IMAGES-->
    <section>
        <!--IMAGE ONE-->
        <div class="image-container" id="image1">
            <img src="images/tokyo-night.jpg">

        </div>
        <!--IMAGE TWO-->
        <div class="image-container" id="image2">
            <img src="images/tokyo-night2.jpg" class="zoom">
        </div>
        <!--IMAGE THREE-->
        <div class="image-container" id="image3">
            <div class="circle">
                <img src="images/Tokyo-night3.jpg">
            </div>
        </div>
    </section>
    <!--FOOTER-->
    <footer>
        <div class="footer-text">
            <p>The Tech Academy &copy;</p>
        </div>

</html>
